# Nginx front for the optional two-container deploy (docker-compose.yml).
# Serves the static game and proxies /ws to the game container — the
# single-container deploy (Containerfile.game) needs none of this.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ws {
        proxy_pass http://game:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # the lobby + health pass through to the game container too
    location ~ ^/(rooms|health)$ {
        proxy_pass http://game:8080;
        proxy_set_header Host $host;
    }
}
