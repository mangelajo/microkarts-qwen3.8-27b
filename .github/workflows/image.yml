name: Image

# Builds the single-container game server image and pushes it to ghcr.
# The home host pulls `ghcr.io/mangelajo/microkarts:latest` (see the
# traefik compose in /root/composer/enabled/microkarts on 192.168.1.2).
#
# The runner is x86_64, so the image is natively amd64 (the quay route
# from an ARM Mac hit a token-endpoint 405 on blob reuse — this route
# also skips the QEMU cross-build).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Containerfile.game'
      - 'server/**'
      - 'src/**'
      - 'ai-sim/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/image.yml'

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -f Containerfile.game \
            -t "ghcr.io/${{ github.repository_owner }}/microkarts:latest" \
            -t "ghcr.io/${{ github.repository_owner }}/microkarts:sha-${{ github.sha }}" \
            .
          docker push "ghcr.io/${{ github.repository_owner }}/microkarts:latest"
          docker push "ghcr.io/${{ github.repository_owner }}/microkarts:sha-${{ github.sha }}"
