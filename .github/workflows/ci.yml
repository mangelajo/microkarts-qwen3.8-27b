name: CI

# Everything the project guarantees is headless: lint, the AI bench on
# every track, and the wire + 2P host sims. If these pass, the game works.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Lint (src + ai-sim)
        run: make lint
      - name: Static import-graph check
        run: make imports
      - name: AI bench — every track, every scenario
        run: make sim
      - name: Wire + host-authoritative 2P sims
        run: make netsim
      - name: QR encoder (structural + RS decode gate)
        run: make qrcheck
  render:  # Playwright boot check — if the browser can start the game and
           # render the menu/race without a single JS error, it works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx playwright install --with-deps chromium
      - name: Screenshots (menu + 2P + countdown + race, desktop & phone)
        run: npm run screens
