<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Micro Kart Racing</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#140e0a;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  body { user-select:none; }
  #app { position:fixed; inset:0; }

  .hud { position:fixed; pointer-events:none; color:#ffe9c9; text-shadow:0 1px 3px rgba(0,0,0,.7); z-index:5; }
  .hudbox { background:rgba(12,8,5,.45); padding:10px 14px; border-radius:10px;
    border:1px solid rgba(255,210,150,.14); backdrop-filter:blur(4px); }
  #lap-hud { top:18px; left:20px; font-size:15px; line-height:1.7; min-width:118px; }
  #lap-hud .big { font-size:22px; font-weight:700; color:#ffd07a; letter-spacing:1px; }
  #pos-hud { top:118px; left:20px; text-align:center; font-size:11px; letter-spacing:2px; color:#d8b07f; }
  #pos-hud .big { font-size:26px; font-weight:800; color:#fff3df; letter-spacing:1px; }
  #pos-hud .big.lead { color:#9fe08a; }
  #pos-hud .big .dim { font-size:18px; color:#8a6a44; margin:0 2px; }
  #time-hud { top:18px; right:20px; text-align:right; font-size:14px; line-height:1.8; }
  #time-hud .val { color:#fff3df; }
  #best .val { color:#9fe08a; }
  #speed-hud { bottom:22px; right:24px; text-align:right; }
  #speed-hud #speed { font-size:46px; font-weight:800; color:#fff3df; letter-spacing:1px; }
  #speed-hud .unit { font-size:12px; letter-spacing:3px; color:#e8c493; }
  #warn { bottom:96px; left:50%; transform:translateX(-50%); font-size:14px; letter-spacing:4px;
    color:#ff9d6b; opacity:0; transition:opacity .12s; }
  #warn.on { opacity:1; }
  #countdown { top:30%; left:50%; transform:translate(-50%,-50%); font-size:120px; font-weight:800;
    color:#ffd07a; text-shadow:0 4px 18px rgba(0,0,0,.8); opacity:0; transition:opacity .15s, transform .1s; z-index:6; }
  #countdown.on { opacity:1; }
  #countdown.go { color:#9fe08a; font-size:84px; letter-spacing:8px; }
  #mute { bottom:18px; left:20px; font-size:12px; letter-spacing:2px; color:#d8b07f; cursor:pointer; pointer-events:auto; opacity:.75; }
  #mute.on { color:#ff9d6b; opacity:1; }

  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(22,14,7,.5), rgba(10,6,3,.88)); z-index:10; }
  #overlay.hidden { display:none; }
  .panel { text-align:center; color:#ffe9c9; padding:36px 48px; max-width:540px;
    background:rgba(18,12,7,.78); border:1px solid rgba(255,200,120,.25); border-radius:16px;
    backdrop-filter:blur(6px); }
  .panel h1 { font-size:30px; letter-spacing:5px; color:#ffd07a; margin-bottom:6px; }
  .panel .sub { font-size:12px; color:#d8b07f; letter-spacing:3px; margin-bottom:24px; }
  .keys { text-align:left; display:inline-block; font-size:14px; line-height:2.2; margin-bottom:20px; }
  kbd { display:inline-block; min-width:34px; text-align:center; background:#2a1d12;
    border:1px solid #5a3f26; border-bottom-width:3px; border-radius:6px; padding:2px 8px;
    font:inherit; margin-right:12px; color:#ffe9c9; }
  .btn { pointer-events:auto; cursor:pointer; font:inherit; font-size:16px; letter-spacing:3px;
    color:#1a0f06; background:linear-gradient(#ffd07a,#f0a94a); border:none; border-radius:10px;
    padding:12px 32px; box-shadow:0 4px 0 #8a5a1e; transition:transform .06s, box-shadow .06s; }
  .btn:hover { filter:brightness(1.06); }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #8a5a1e; }
  .result { font-size:15px; line-height:2.1; margin-bottom:24px; }
  .result b { color:#ffd07a; }
</style>
</head>
<body>
<div id="app"></div>

<div class="hud hudbox" id="lap-hud">
  <div class="big" id="lap">LAP 1/3</div>
  <div>TIME <span id="time">0:00.0</span></div>
</div>
<div class="hud hudbox" id="pos-hud">
  <div class="big"><span id="pos">1</span><span class="dim">/</span><span id="nCars">4</span></div>
  <div>POS</div>
</div>
<div class="hud hudbox" id="time-hud">
  <div>LAP <span class="val" id="laptime">0:00.0</span></div>
  <div class="lbl" id="best">BEST <span class="val">--</span></div>
</div>
<div class="hud" id="speed-hud">
  <div id="speed">0</div>
  <div class="unit">KM/H</div>
</div>
<div class="hud" id="warn">OFF TRACK</div>
<div class="hud" id="mute" title="Mute (M)">M</div>
<div class="hud" id="countdown"></div>

<div id="overlay">
  <div class="panel">
    <h1 id="title">MICRO KART RACING</h1>
    <div class="sub" id="subtitle">A TINY CIRCUIT ON THE DINNER TABLE</div>
    <div class="keys" id="keys">
      <div><kbd>W / ↑</kbd>Accelerate</div>
      <div><kbd>S / ↓</kbd>Brake · Reverse</div>
      <div><kbd>A D / ← →</kbd>Steer</div>
      <div><kbd>M</kbd>Sound on/off</div>
    </div>
    <div class="result" id="results" style="display:none"></div>
    <br/>
    <button class="btn" id="startBtn">START RACE</button>
    <div class="sub" id="footnote" style="margin:16px 0 0 0">OR PRESS ENTER &nbsp;·&nbsp; 3 LAPS</div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
